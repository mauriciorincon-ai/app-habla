allowBuilds:
  sharp: true
  unrs-resolver: true
  '@swc/core': true
  esbuild: true
  '@tailwindcss/oxide': true
  '@sentry/cli': false
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@swc/core'
  - esbuild
  - '@tailwindcss/oxide'
ignoredBuiltDependencies:
  - '@sentry/cli'

# Candados de seguridad (gate S4, cierre): lote de advisories del 2026-08-07 en transitivas.
# Cada selector fija la línea vulnerable en su versión parchada; se revisan al subir mayores.
# Rangos con CARET a propósito: un ">=" abierto resuelve al latest global y puede saltar de
# mayor (brace-expansion@1 → 5 rompió minimatch@3 en el primer intento).
overrides:
  "fast-uri@3": "^3.1.5"
  "sharp": "^0.35.0"
  "postcss@8": "^8.5.18"
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@5": "^5.0.9"
  "undici@7": "^7.29.0"
  "js-yaml@4": "^4.3.1"
