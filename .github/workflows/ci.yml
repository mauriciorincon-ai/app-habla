# CI del kit-app — corre en cada PR y en push a main.
# Gates: typecheck, lint, tests+cobertura, build, audit de deps, e2e, Lighthouse vs perf-budget.json
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }   # el scaffold estampa pnpm 11 (lockfile + allowBuilds); pnpm 11 exige Node >=22.13
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test            # vitest run --coverage (umbral 70% en vitest.config)
      - run: pnpm build
      - run: pnpm audit --audit-level high
      # kit v2.0.0 — regla 17 (cero enlaces, F0 #8) pasa de casilla manual a gate de CI (auditoria 2026-10-06, R9/Q3a).
      # La produccion se MUESTRA, jamas se ENTREGA. Dos superficies: los archivos versionados (git grep) y el campo
      # `homepage` del repo en GitHub (la fuga de nutri-kids de 2026-08 vivia ahi). Los dominios salen de cero-enlaces.json
      # (8 por defecto; cada app SUMA el host real de su stack al adoptar el kit; jamas se quita uno). Demo en rojo:
      # scripts/demo-rojo.sh (visto en rojo en el S7 con un dominio inventado, y de vuelta en verde al restaurar).
      - name: Cero enlaces — árbol y homepage del repo (regla 17, kit v2.0.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOMEPAGE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.homepage // ""')"
          node scripts/cero-enlaces.mjs --homepage "$HOMEPAGE"

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }   # el scaffold estampa pnpm 11 (lockfile + allowBuilds); pnpm 11 exige Node >=22.13
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e        # incluye scans axe (@axe-core/playwright)

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }   # el scaffold estampa pnpm 11 (lockfile + allowBuilds); pnpm 11 exige Node >=22.13
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI contra perf-budget.json (URLs de lighthouse-urls.json)
        # Cada sprint añade sus rutas nuevas a lighthouse-urls.json (default: ["/"]).
        # Nota Lantern: el LCP SIMULADO sobre localhost castiga SPAs sanas (nutri-kids S1:
        # 3.8s simulado vs 242ms observado) — budgets client-side necesitan margen documentado.
        run: |
          npm i -g @lhci/cli
          URLS=$(node -e "console.log(require('./lighthouse-urls.json').map(u=>'--collect.url=http://127.0.0.1:3500'+u).join(' '))")
          lhci autorun --collect.startServerCommand="pnpm start" $URLS --assert.budgetsFile=./perf-budget.json
